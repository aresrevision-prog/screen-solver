<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>screen-solver</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon192.png">
<meta name="theme-color" content="#14161b">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 14px; font: 14px/1.5 system-ui, sans-serif; background: #14161b; color: #e8eaf0; max-width: 560px; }
  h1 { font-size: 17px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .row { display: flex; gap: 6px; margin-bottom: 6px; }
  button { flex: 1; padding: 10px; border: 0; border-radius: 8px; background: #4f8cff; color: #fff; font-weight: 600; cursor: pointer; font: inherit; font-weight: 600; }
  button.alt { background: #2a2e38; }
  button.live { background: #1f9d55; }
  button:disabled { opacity: .5; cursor: default; }
  #install { flex: 0; padding: 6px 12px; display: none; }
  textarea, input { width: 100%; box-sizing: border-box; background: #1d2028; color: inherit; border: 1px solid #333846; border-radius: 8px; padding: 8px; font: inherit; }
  textarea { height: 48px; resize: vertical; margin-bottom: 8px; }
  #status { color: #9aa3b5; min-height: 20px; margin: 6px 0; }
  #status.err { color: #ff7a7a; }
  #out { background: #1d2028; border-radius: 8px; padding: 12px; word-wrap: break-word; }
  #out:empty { display: none; }
  code { background: #2a2e38; padding: 1px 4px; border-radius: 4px; }
  details { margin-top: 14px; color: #9aa3b5; }
  details input { margin: 6px 0; }
  a { color: #7aa7ff; }
  video { display: none; }
  #crop { position: fixed; inset: 0; background: #000; display: none; z-index: 9; touch-action: none; cursor: crosshair; }
  #crop canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
  #box { position: fixed; border: 2px solid #4f8cff; background: rgba(79,140,255,.15); display: none; pointer-events: none; }
  #tip { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: #111; padding: 6px 12px; border-radius: 6px; pointer-events: none; }
</style>
</head>
<body>
  <h1>screen-solver <button id="install" class="alt">Install</button></h1>
  <div id="setup" style="display:none">
    <p>Paste your free Gemini API key to start. Get one at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> (Create API key → copy).</p>
    <input id="key" type="password" placeholder="Paste key here" autocomplete="off">
    <div class="row" style="margin-top:8px"><button id="start">Start</button></div>
    <div id="setupStatus" style="color:#9aa3b5"></div>
  </div>
  <div id="main" style="display:none">
  <textarea id="note" placeholder="Optional: e.g. 'just question 3' or 'explain simply'"></textarea>
  <div class="row"><button id="share" class="alt">Share screen</button></div>
  <div class="row">
    <button id="whole" disabled>Solve screen</button>
    <button id="area" class="alt" disabled>Select area</button>
  </div>
  <div id="status">Press "Share screen" and pick your entire screen.</div>
  <div id="out"></div>
  <div class="row" style="margin-top:6px"><button id="copy" class="alt" hidden>Copy answer</button></div>

  <p style="margin-top:14px"><a href="#" id="changeKey">Change API key</a></p>
  </div>

  <video id="vid" muted playsinline></video>
  <div id="crop"><canvas id="cv"></canvas><div id="box"></div><div id="tip">Drag around the problem · Esc to cancel</div></div>

<script>
const $ = id => document.getElementById(id);
const vid = $('vid'), cv = $('cv'), crop = $('crop'), box = $('box');
let stream = null, lastText = '', deferred = null;

const store = {
  get: k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
};
const setStatus = (t, err) => { $('status').textContent = t; $('status').className = err ? 'err' : ''; };
const busy = b => ['whole', 'area'].forEach(id => $(id).disabled = b || !stream);
const note = () => $('note').value.trim();

function render(text) {
  lastText = text;
  $('out').innerHTML = text.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^#+\s*(.+)$/gm, '<b>$1</b>').replace(/\n/g, '<br>');
  $('copy').hidden = false;
}

$('share').onclick = async () => {
  if (stream) { stream.getTracks().forEach(t => t.stop()); return; }
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: 'monitor' }, audio: false });
    vid.srcObject = stream; await vid.play();
    stream.getVideoTracks()[0].onended = () => {
      stream = null; vid.srcObject = null;
      $('share').textContent = 'Share screen'; $('share').className = 'alt'; busy(false);
      setStatus('Screen sharing stopped.');
    };
    $('share').textContent = 'Stop sharing'; $('share').className = 'live'; busy(false);
    setStatus('Reading your screen. Switch to your work, come back and press Solve.');
  } catch { setStatus('Screen share cancelled.', true); }
};

function grab() {
  cv.width = vid.videoWidth; cv.height = vid.videoHeight;
  cv.getContext('2d').drawImage(vid, 0, 0);
}

$('whole').onclick = () => { grab(); solve(cv.toDataURL('image/png').split(',')[1]); };

// Area select on a frozen frame
let sx, sy, drag = false, r = null;
$('area').onclick = () => { grab(); crop.style.display = 'block'; box.style.display = 'none'; };
const closeCrop = () => { crop.style.display = 'none'; drag = false; };
const rectOf = e => ({ x: Math.min(sx, e.clientX), y: Math.min(sy, e.clientY), w: Math.abs(e.clientX - sx), h: Math.abs(e.clientY - sy) });
crop.onpointerdown = e => { sx = e.clientX; sy = e.clientY; drag = true; crop.setPointerCapture(e.pointerId); box.style.display = 'block'; move(e); };
crop.onpointermove = e => drag && move(e);
function move(e) { r = rectOf(e); Object.assign(box.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' }); }
crop.onpointerup = e => {
  if (!drag) return; r = rectOf(e); closeCrop();
  if (r.w < 5 || r.h < 5) return setStatus('Cancelled.');
  // map screen rect -> image pixels (canvas is object-fit: contain)
  const b = cv.getBoundingClientRect(), s = Math.min(b.width / cv.width, b.height / cv.height);
  const ox = b.left + (b.width - cv.width * s) / 2, oy = b.top + (b.height - cv.height * s) / 2;
  let x = (r.x - ox) / s, y = (r.y - oy) / s, w = r.w / s, h = r.h / s;
  x = Math.max(0, x); y = Math.max(0, y); w = Math.min(w, cv.width - x); h = Math.min(h, cv.height - y);
  if (w < 2 || h < 2) return setStatus('Cancelled.');
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(cv, x, y, w, h, 0, 0, w, h);
  solve(c.toDataURL('image/png').split(',')[1]);
};
addEventListener('keydown', e => { if (e.key === 'Escape' && crop.style.display === 'block') { closeCrop(); setStatus('Cancelled.'); } });

const PREFERRED = ['gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-2.0-flash', 'gemini-2.0-flash-lite', 'gemini-1.5-flash'];
const API = 'https://generativelanguage.googleapis.com/v1beta/models';

// Ask Google which models this key can use, best first
async function findModels(key) {
  const res = await fetch(`${API}?pageSize=200&key=${encodeURIComponent(key)}`);
  const j = await res.json();
  if (!res.ok) throw new Error(j.error?.message || 'HTTP ' + res.status);
  const ok = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent')).map(m => m.name.replace('models/', ''));
  const list = PREFERRED.filter(m => ok.includes(m));
  const extra = ok.filter(m => /flash/.test(m) && !/(tts|image|audio|live|embedding|thinking)/.test(m) && !list.includes(m));
  const all = [...list, ...extra];
  if (!all.length) throw new Error('No usable models on this key.');
  return all;
}

async function callModel(key, model, prompt, b64) {
  const res = await fetch(`${API}/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: 'image/png', data: b64 } }] }] })
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(j.error?.message || 'HTTP ' + res.status); e.status = res.status; throw e; }
  return (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').trim() || 'No answer returned.';
}

async function solve(b64) {
  const key = store.get('key');
  if (!key) return showSetup();
  busy(true); setStatus('Solving…');
  const prompt = 'Read this screenshot. Find the question(s) or problem(s) on it and solve them. ' +
    'For each: give the final answer first in bold, then short step-by-step working. Be concise.' +
    (note() ? '\nExtra instruction: ' + note() : '');
  let models = JSON.parse(store.get('models') || '[]');
  if (!models.length) models = PREFERRED;
  let lastErr;
  for (const m of models) {
    try {
      const text = await callModel(key, m, prompt, b64);
      store.set('last', text); render(text); setStatus('Done.'); busy(false);
      return;
    } catch (e) {
      lastErr = e;
      if (e.status === 400 && /api key/i.test(e.message)) break; // bad key: no point trying others
      setStatus('Busy, trying another model…');
    }
  }
  setStatus(lastErr.status === 400 || lastErr.status === 403 ? 'Your API key was rejected. Tap "Change API key".' :
    lastErr.status === 429 ? 'Free limit hit for now. Wait a minute and try again.' : 'AI error: ' + lastErr.message, true);
  busy(false);
}

$('copy').onclick = () => navigator.clipboard.writeText(lastText).then(() => setStatus('Copied.'));

// One-time setup
function showSetup() { $('main').style.display = 'none'; $('setup').style.display = 'block'; $('key').value = store.get('key'); $('key').focus(); }
function showMain() { $('setup').style.display = 'none'; $('main').style.display = 'block'; }
$('changeKey').onclick = e => { e.preventDefault(); showSetup(); };
$('key').onkeydown = e => { if (e.key === 'Enter') $('start').click(); };
$('start').onclick = async () => {
  const key = $('key').value.trim().replace(/\s/g, '');
  if (!key) return $('setupStatus').textContent = 'Paste your key first.';
  $('start').disabled = true; $('setupStatus').textContent = 'Checking key…';
  try {
    const models = await findModels(key);
    store.set('key', key); store.set('models', JSON.stringify(models));
    $('setupStatus').textContent = '';
    showMain(); setStatus('Ready. Press "Share screen" and pick your entire screen.');
  } catch (e) {
    $('setupStatus').textContent = 'That key didn\'t work: ' + e.message;
  }
  $('start').disabled = false;
};

// Install button
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('install').style.display = 'block'; });
$('install').onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $('install').style.display = 'none'; };
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

if (store.get('key')) showMain(); else showSetup();
if (store.get('last')) render(store.get('last'));
</script>
</body>
</html>
